<html>
  <head>
    <style>
      body {
        font-family: Arial;
        padding: 40px;
      }
      h1 {
        color: #333;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #f4f4f4;
      }
    </style>
  </head>
  <body>
    <h1>Invoice</h1>
    <p><strong>Name:</strong> {{name}}</p>
    <p><strong>Email:</strong> {{email}}</p>

    <table>
      <tr>
        <th>Item</th>
        <th>Price</th>
      </tr>
      {{itemsRows}}
    </table>
  </body>
</html>
