<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>1-to-1 Chat Test (Socket.IO)</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        padding-top: 40px;
      }
      .chat-box {
        width: 420px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        padding: 16px;
      }
      h2 {
        text-align: center;
        margin-bottom: 10px;
      }
      input,
      button {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
      }
      button {
        cursor: pointer;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: 10px;
        max-height: 260px;
        overflow-y: auto;
      }
      li {
        padding: 6px;
        margin-bottom: 4px;
        border-radius: 4px;
        background: #e0e0e0;
      }
      .me {
        background: #c8e6c9;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="chat-box">
      <h2>1-to-1 Chat</h2>

      <input id="otherUserId" placeholder="Other User ID" />
      <button type="button" onclick="joinConversation()">
        Join Conversation
      </button>

      <hr />

      <ul id="messages"></ul>

      <input id="messageInput" placeholder="Type a message..." />
      <button type="button" onclick="sendMessage()">Send Message</button>

      <input id="fileInput" type="file" />
      <button type="button" onclick="sendFile()">Send File</button>
    </div>

    <script>
      const token = localStorage.getItem('token');

      const socket = io('http://localhost:3000', {
        transports: ['websocket'],
        auth: { token: `Bearer ${token}` },
      });

      let conversationId = null;
      let currentUserId = null;

      socket.on('connect', () => {
        console.log('Connected:', socket.id);
      });

      socket.on('connect_error', (err) => {
        console.error('Socket error:', err.message);
      });

      // -----------------------------
      // JOIN CONVERSATION
      // -----------------------------
      function joinConversation() {
        const otherUserId = document.getElementById('otherUserId').value.trim();
        if (!otherUserId) return alert('Enter Other User ID');

        socket.emit('join_conversation', { anotherUserId: otherUserId });
      }

      socket.on('joined', (data) => {
        conversationId = data.conversationId;
        currentUserId = data.userId;
        loadMessages(data.messages);
        loadAttachments(data.attachments);
      });

      // -----------------------------
      // SEND TEXT MESSAGE
      // -----------------------------
      function sendMessage() {
        const text = document.getElementById('messageInput').value.trim();
        if (!text || !conversationId) return;

        socket.emit('send_message', {
          conversationId,
          content: text,
          type: 'text',
        });

        addMessage(`Me: ${text}`, true);
        document.getElementById('messageInput').value = '';
      }

      // -----------------------------
      // SEND FILE MESSAGE
      // -----------------------------
      async function sendFile() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if (!file) alert('File is required!');

        if (!conversationId) alert('Please join the conversation');

        const formData = new FormData();
        formData.append('file', file);

        try {
          // 1️⃣ Upload file
          const res = await fetch('http://localhost:3000/files/upload', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
            },
            body: formData,
          });

          const result = await res.json();
          const fileId = result.data;

          const text = document.getElementById('messageInput').value.trim();

          // 2️⃣ Send websocket message with attachment UUID
          socket.emit('send_message', {
            conversationId,
            type: 'image',
            content: text ? text : null,
            attachments: [fileId],
          });

          // 3️⃣ Render local preview (NO download)
          const localPreviewUrl = URL.createObjectURL(file);
          addImage(localPreviewUrl, true);

          fileInput.value = '';
        } catch (err) {
          console.error('File upload failed', err);
        }
      }

      // -----------------------------
      // RECEIVE MESSAGE
      // -----------------------------
      socket.on('receive_message', async (msg) => {
        const isMe = msg.sender.id === currentUserId;

        if (msg.type === 'text') {
          addMessage(`${isMe ? 'Me' : msg.sender.name}: ${msg.content}`, isMe);
        }

        if (msg.type === 'image' && msg.attachments?.length) {
          for (const fileId of msg.attachments) {
            await downloadAndRenderImage(fileId.id, isMe);
          }
        }
      });

      // -----------------------------
      // DOWNLOAD FILE (STREAM → BLOB)
      // -----------------------------
      async function downloadAndRenderImage(fileId, isMe) {
        try {
          const res = await fetch(
            `http://localhost:3000/files/download/${fileId}`,
            {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            },
          );
          console.log(res);

          if (!res.ok) {
            console.error('Failed to download file');
            return;
          }

          addImage(imageUrl, isMe);
        } catch (err) {
          console.error('Download error', err);
        }
      }

      // -----------------------------
      // UI HELPERS
      // -----------------------------
      function addMessage(text, isMe) {
        const li = document.createElement('li');
        li.textContent = text;
        if (isMe) li.classList.add('me');
        document.getElementById('messages').appendChild(li);
        li.scrollIntoView({ behavior: 'smooth' });
      }

      function addImage(src, isMe) {
        const li = document.createElement('li');
        const img = document.createElement('img');

        img.src = src;
        img.style.maxWidth = '220px';
        img.style.borderRadius = '6px';
        img.style.display = 'block';

        li.appendChild(img);
        if (isMe) li.classList.add('me');
        document.getElementById('messages').appendChild(li);
        li.scrollIntoView({ behavior: 'smooth' });
      }

      function loadMessages(messages) {
        document.getElementById('messages').innerHTML = '';
        messages.forEach((msg) => {
          const isMe = msg.sender.id === currentUserId;

          if (msg.type === 'text') {
            addMessage(
              `${isMe ? 'Me' : msg.sender.name}: ${msg.content}`,
              isMe,
            );
          }
        });
      }

      function loadAttachments(attachments) {
        document.getElementById('messages').innerHTML = '';

        attachments.map(async (attachment) => {
          if (attachment.mimeType === 'image') {
            const isMe = attachment.message.sender.id === currentUserId;
            await downloadAndRenderImage(attachment.media.id, isMe);
          }
        });
      }
    </script>
  </body>
</html>
