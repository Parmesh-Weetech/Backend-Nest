<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>1-to-1 Chat Test (Socket.IO)</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        padding-top: 40px;
      }
      .chat-box {
        width: 420px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        padding: 16px;
      }
      h2 {
        text-align: center;
        margin-bottom: 10px;
      }
      input,
      button {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
      }
      button {
        cursor: pointer;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: 10px;
        max-height: 260px;
        overflow-y: auto;
      }
      li {
        padding: 6px;
        margin-bottom: 4px;
        border-radius: 4px;
        background: #e0e0e0;
      }
      .me {
        background: #c8e6c9;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="chat-box">
      <h2>1-to-1 Chat</h2>

      <input id="otherUserId" placeholder="Other User ID" />
      <button onclick="joinConversation()">Join Conversation</button>

      <hr />

      <ul id="messages"></ul>

      <input id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send Message</button>
    </div>

    <script>
      // JWT token from login
      const token = localStorage.getItem('token');

      // Connect Socket.IO with JWT auth
      window.socket = io('http://localhost:3000', {
        transports: ['websocket'],
        withCredentials: true,
        auth: { token },
      });

      const socket = window.socket;

      let conversationId = null;
      let currentUserId = null;
      let anotherUserId = null;
      let messages = null;

      socket.on('connect', () => {
        console.log('Connected:', socket.id);
      });

      socket.on('connect_error', (err) => {
        console.error('Connection error:', err.message);
      });

      // Join conversation
      function joinConversation() {
        anotherUserId = document.getElementById('otherUserId').value.trim();
        if (!anotherUserId) return alert('Enter Other User ID');

        socket.emit('join_conversation', { anotherUserId });
      }

      socket.on('joined', (data) => {
        console.log('Joined conversation:', data);
        conversationId = data.conversationId;
        currentUserId = data.userId;
        anotherUserId = data.anotherUserId;
        messages = data.messages;
        loadMessages(messages);
      });

      // Send message
      function sendMessage() {
        const text = document.getElementById('messageInput').value.trim();
        if (!text) return;
        if (!conversationId) return alert('Join a conversation first!');

        socket.emit('send_message', {
          conversationId,
          receiverId: anotherUserId,
          content: text,
          type: 'text',
        });

        addMessage(`Me: ${text}`, true);
        document.getElementById('messageInput').value = '';
      }

      // Receive message
      socket.on('receive_message', (msg) => {
        const isMe = msg.sender.id === currentUserId;
        const senderLabel = isMe ? 'Me' : `${msg.sender.name}`;
        addMessage(`${senderLabel}: ${msg.content}`, isMe);
      });

      socket.on('history', (messages) => {
        document.getElementById('messages').innerHTML = ''; // clear previous
        messages.forEach((msg) => {
          const isMe = msg.sender.id === currentUserId;
          const senderLabel = isMe ? 'Me' : `${msg.sender.name}`;
          addMessage(`${senderLabel}: ${msg.content}`, isMe);
        });
      });

      // Helper to add message to DOM
      function addMessage(text, isMe) {
        const li = document.createElement('li');
        li.textContent = text;
        if (isMe) li.classList.add('me');
        document.getElementById('messages').appendChild(li);
        li.scrollIntoView({ behavior: 'smooth' });
      }

      function loadMessages(messages) {
        document.getElementById('messages').innerHTML = ''; // clear previous
        messages.forEach((msg) => {
          const isMe = msg.sender.id === currentUserId;
          const senderLabel = isMe ? 'Me' : `${msg.sender.name}`;
          addMessage(`${senderLabel}: ${msg.content}`, isMe);
        });
      }
    </script>
  </body>
</html>
